name: Azure CI Secret Replay (Synthetic Only)

# SOC lab: reproduces the detection-relevant shape of the Nov 2026 'wfx'
# CI secret-stealer (scrape -> use -> exfiltrate) using ONLY invalid seeded
# credentials and loopback-only network calls. No real secrets, no Azure
# login, no OIDC request, and no external egress.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate fixture-only replay
        run: python3 -B -m unittest discover -s attack/ci-secret-replay -p 'test_*.py'

      - name: Scrape, use and exfiltrate synthetic credentials (loopback only)
        working-directory: attack/ci-secret-replay
        run: python3 -B replay.py

      - name: Demonstrate the toJSON(secrets) env-dump vector (seeded, not real)
        working-directory: attack/ci-secret-replay
        # Mirrors the campaign's injected env var name WF_SECRETS. The value is a
        # seeded synthetic dump from the fixtures, NOT a dump of real secrets, so
        # this does not use toJSON(secrets) against the repository's secret store.
        run: |
          set -euo pipefail
          WF_SECRETS="$(cat fixtures/secrets-dump.json)" python3 -B replay.py
